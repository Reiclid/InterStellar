name: Build & Release InterStellar (EXE + APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Web Dist
        run: npm run build

      - name: Build Windows EXE via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'InterStellar Real Decentralized Mesh ${{ github.ref_name }}'
          releaseBody: '✦ Real Cryptographic Ed25519/X25519 Identity & Double Ratchet E2EE\n✦ Zero Mock Data: Live WebRTC & BroadcastChannel Peer Discovery\n✦ Multi-Transport Mesh: LAN, Ultrasonic Acoustic Modem, Optical QR\n✦ Native Windows EXE & Android APK Releases'
          releaseDraft: false
          prerelease: false

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: interstellar-web-dist
          path: dist/
